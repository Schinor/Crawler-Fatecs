# Garage (S3 compatível) para desenvolvimento local, com um único nó.
# Os segredos NÃO ficam aqui: rpc_secret e admin_token vêm das variáveis
# GARAGE_RPC_SECRET e GARAGE_ADMIN_TOKEN do .env (gerado por `make env`).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
