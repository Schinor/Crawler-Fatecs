# Credenciais abaixo são só para desenvolvimento local. Em nuvem, usar segredos do provedor.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fatecorg
      POSTGRES_PASSWORD: fatecorg
      POSTGRES_DB: fatecorg
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fatecorg
      MINIO_ROOT_PASSWORD: fatecorg-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
