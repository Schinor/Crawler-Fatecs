<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header class="topo">
  <div class="largura">
    <a routerLink="/" class="marca">FatecOrg</a>
    <nav aria-label="Principal">
      <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }"
        >Unidades</a
      >
      <a routerLink="/busca" routerLinkActive="ativo">Buscar</a>
      <a routerLink="/documentos" routerLinkActive="ativo">Documentos</a>
      @if (auth.podeEnviar()) {
        <a routerLink="/enviar" routerLinkActive="ativo">Enviar</a>
      }
      @if (auth.ehAdmin()) {
        <a routerLink="/admin/coletas" routerLinkActive="ativo">Coletas</a>
      }
      @if (auth.usuario(); as u) {
        <button type="button" (click)="sair()" [attr.aria-label]="'Sair da conta de ' + u.nome">
          Sair
        </button>
      } @else {
        <a routerLink="/entrar" routerLinkActive="ativo">Entrar</a>
      }
    </nav>
  </div>
</header>
<main id="conteudo" class="largura" tabindex="-1">
  <router-outlet />
</main>
<footer class="largura discreto">
  Projeto Integrador · Fatec Pompeia · Polo Regional 08 do Centro Paula Souza
</footer>
