[project]
name = "fatecorg-crawler"
version = "0.1.0"
description = "Crawler dos PPCs das Fatecs"
requires-python = ">=3.12"
dependencies = [
  "fatecorg-core",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "tenacity>=8.5",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pymupdf>=1.24",
  "pydantic-settings>=2.4",
]

[project.scripts]
fatecorg-crawler = "fatecorg_crawler.cli:app"

[tool.uv.sources]
fatecorg-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fatecorg_crawler"]
