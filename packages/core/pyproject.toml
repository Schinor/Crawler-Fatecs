[project]
name = "fatecorg-core"
version = "0.1.0"
description = "Domínio compartilhado do FatecOrg"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fatecorg_core"]
